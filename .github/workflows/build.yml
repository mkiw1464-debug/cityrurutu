      - name: Build and install ldid
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          rm -rf ldid

          git clone --depth=1 \
            https://github.com/ProcursusTeam/ldid.git \
            ldid

          cd ldid

          make -j"$(nproc)"
          sudo make install

          command -v ldid
          ldid -h || true

      - name: Install Theos
        shell: bash
        run: |
          set -e

          rm -rf "$THEOS"

          git clone \
            --recursive \
            --depth=1 \
            https://github.com/theos/theos.git \
            "$THEOS"

      - name: Install iOS Theos Toolchain
        shell: bash
        run: |
          set -e

          TOOLCHAIN_DIR="$THEOS/toolchain/linux/iphone"

          mkdir -p "$TOOLCHAIN_DIR"

          cd "$RUNNER_TEMP"

          rm -f ios-toolchain.tar.lzma

          wget -O ios-toolchain.tar.lzma \
            https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma

          echo "========== TOOLCHAIN ARCHIVE =========="

          tar --lzma -tf ios-toolchain.tar.lzma | head -30

          echo "========== EXTRACT =========="

          rm -rf "$TOOLCHAIN_DIR"/*

          tar --lzma \
            -xf ios-toolchain.tar.lzma \
            -C "$TOOLCHAIN_DIR"

          echo "========== TOOLCHAIN CONTENT =========="

          find "$TOOLCHAIN_DIR" -maxdepth 3 -type f \
            \( -name clang -o -name clang++ -o -name ld64 \) \
            -print

          echo "========== CLANG =========="

          export PATH="$TOOLCHAIN_DIR/bin:$PATH"

          "$TOOLCHAIN_DIR/bin/clang" --version

      - name: Install iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -e

          SDK_DIR="$THEOS/sdks"

          mkdir -p "$SDK_DIR"

          cd "$RUNNER_TEMP"

          rm -f iPhoneOS16.5.sdk.tar.xz

          wget -O iPhoneOS16.5.sdk.tar.xz \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz

          tar -xJf \
            iPhoneOS16.5.sdk.tar.xz \
            -C "$SDK_DIR"

          test -d "$SDK_DIR/iPhoneOS16.5.sdk"

          echo "SDK installed:"
          ls -ld "$SDK_DIR/iPhoneOS16.5.sdk"

      - name: Verify build environment
        shell: bash
        run: |
          set -e

          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"

          echo "========== ENVIRONMENT =========="

          echo "THEOS=$THEOS"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"

          echo
          echo "========== ldid =========="

          command -v ldid

          echo
          echo "========== clang =========="

          command -v clang
          clang --version

          echo
          echo "========== SDK =========="

          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo
          echo "========== libtinfo =========="

          find "$RUNNER_TEMP/libtinfo5" \
            -name "libtinfo.so*" \
            -type f \
            -print

      - name: Build FFNET_IOS
        shell: bash
        run: |
          set -e

          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"

          echo "========== BUILD =========="

          make clean || true

          make package \
            FINALPACKAGE=1 \
            TARGET=iphone:clang:16.5:14.0 \
            -j"$(nproc)"

      - name: Find dylib
        shell: bash
        run: |
          set -e

          echo "========== SEARCHING FOR DYLIB =========="

          find . \
            -type f \
            -name "*.dylib" \
            -print

          echo
          echo "========== FFNET_IOS.dylib =========="

          find . \
            -type f \
            -name "FFNET_IOS.dylib" \
            -print
