name: FFNET IOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git curl make perl zip unzip \
            clang llvm lld \
            cmake libplist-dev libssl-dev \
            pkg-config libxml2-dev

      - name: Build & install ldid from source
        run: |
          git clone https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          make -j$(nproc)
          sudo make install
          ldid --version || echo "[FFNET] ldid installed"

    - name: Install Theos
  run: |
    export THEOS="${{ github.workspace }}/theos"

    git clone --recursive https://github.com/theos/theos "$THEOS"

    echo "[FFNET] Downloading iOS toolchain..."

    curl -L \
      "https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma" \
      -o toolchain.tar.lzma

    TMP=$(mktemp -d)

    tar --lzma -xf toolchain.tar.lzma -C "$TMP"

    mkdir -p "$THEOS/toolchain/linux/iphone"

    cp -R "$TMP"/ios-arm64e-clang-toolchain/* \
      "$THEOS/toolchain/linux/iphone/"

    rm -rf "$TMP" toolchain.tar.lzma

    echo "[FFNET] Checking compiler..."
    ls -la "$THEOS/toolchain/linux/iphone/bin"

    test -x "$THEOS/toolchain/linux/iphone/bin/clang"
    test -x "$THEOS/toolchain/linux/iphone/bin/clang++"

    "$THEOS/toolchain/linux/iphone/bin/clang" --version
      
      - name: Download iOS SDK
        run: |
          export THEOS=${{ github.workspace }}/theos
          mkdir -p "$THEOS/sdks"
          curl -L \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" \
            -o sdk.tar.xz
          # Verify not a redirect garbage file
          file sdk.tar.xz
          tar -xf sdk.tar.xz -C "$THEOS/sdks"
          echo "[FFNET] SDK extracted:"
          ls "$THEOS/sdks"

      - name: Download Substrate headers
        run: |
          export THEOS=${{ github.workspace }}/theos
          curl -L \
            "https://github.com/theos/headers/archive/refs/heads/master.tar.gz" \
            -o headers.tar.gz
          tar -xf headers.tar.gz -C "$THEOS/include" --strip-components=1

      - name: Build dylib
        run: |
          export THEOS=${{ github.workspace }}/theos
          make package FINALPACKAGE=1 TARGET=iphone:clang:16.5:14.0
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Sign dylib with ldid
        run: |
          find . -name "*.dylib" | while read f; do
            ldid -Sentitlements.plist "$f"
            echo "[FFNET] Signed: $f"
          done

      - name: Package artifacts
        run: |
          mkdir -p dist

          find . -path "*/packages/*.deb" | head -1 \
            | xargs -I{} cp {} dist/FFNET_IOS.deb || true

          find . -name "FFNET_IOS.dylib" | head -1 \
            | xargs -I{} cp {} dist/FFNET_IOS.dylib || true

          mkdir -p inject_pkg/Frameworks
          cp dist/FFNET_IOS.dylib inject_pkg/Frameworks/FFNET_IOS.dylib || true

          cat > inject_pkg/inject.sh << 'EOF'
          #!/bin/sh
          TARGET_IPA="FreeFire.ipa"
          DYLIB="FFNET_IOS.dylib"
          echo "[FFNET] Injecting $DYLIB into $TARGET_IPA"
          unzip -q "$TARGET_IPA" -d extracted
          cp "$DYLIB" extracted/Payload/FreeFire.app/Frameworks/
          optool install -c load \
            -p "@executable_path/Frameworks/FFNET_IOS.dylib" \
            -t extracted/Payload/FreeFire.app/FreeFire
          cd extracted
          zip -qr "../FFNET_patched.ipa" .
          cd ..
          rm -rf extracted
          echo "[FFNET] Done → FFNET_patched.ipa"
          EOF

          chmod +x inject_pkg/inject.sh
          zip -r dist/FFNET_inject_pkg.zip inject_pkg/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FFNET_IOS_OB54
          path: dist/
          retention-days: 30
