name: FFNET IOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git curl make perl zip unzip \
            clang llvm lld \
            cmake libplist-dev libssl-dev \
            pkg-config libxml2-dev \
            fakeroot xz-utils \
            libio-compress-lzma-perl

      - name: Build & install ldid from source
        run: |
          git clone https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          make -j"$(nproc)"
          sudo make install
          ldid --version

      - name: Install Theos
        run: |
          export THEOS="${{ github.workspace }}/theos"

          echo "[FFNET] Installing Theos..."

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo "[FFNET] Installing Linux iOS toolchain..."

          curl -L \
            "https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma" \
            -o /tmp/linux-ios-toolchain.tar.lzma

          TMP="$(mktemp -d)"

          tar --lzma \
            -xf /tmp/linux-ios-toolchain.tar.lzma \
            -C "$TMP"

          mkdir -p "$THEOS/toolchain/linux/iphone"

          if [ -d "$TMP/ios-arm64e-clang-toolchain" ]; then
            cp -a \
              "$TMP/ios-arm64e-clang-toolchain/." \
              "$THEOS/toolchain/linux/iphone/"
          else
            echo "[FFNET] ERROR: Toolchain archive has unexpected structure:"
            find "$TMP" -maxdepth 3 -type f | head -100
            exit 1
          fi

          rm -rf "$TMP"
          rm -f /tmp/linux-ios-toolchain.tar.lzma

          echo "[FFNET] Checking toolchain..."

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang++"

          "$THEOS/toolchain/linux/iphone/bin/clang" --version
          "$THEOS/toolchain/linux/iphone/bin/clang++" --version

          echo "[FFNET] Toolchain OK"

      - name: Download iOS SDK
        run: |
          export THEOS="${{ github.workspace }}/theos"

          mkdir -p "$THEOS/sdks"

          curl -L \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" \
            -o /tmp/sdk.tar.xz

          file /tmp/sdk.tar.xz

          tar -xf /tmp/sdk.tar.xz \
            -C "$THEOS/sdks"

          echo "[FFNET] SDKs:"
          ls -la "$THEOS/sdks"

          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Download Substrate headers
        run: |
          export THEOS="${{ github.workspace }}/theos"

          mkdir -p "$THEOS/include"

          curl -L \
            "https://github.com/theos/headers/archive/refs/heads/master.tar.gz" \
            -o /tmp/headers.tar.gz

          tar -xf /tmp/headers.tar.gz \
            -C "$THEOS/include" \
            --strip-components=1

          echo "[FFNET] Headers installed"

      - name: Verify Theos
        run: |
          export THEOS="${{ github.workspace }}/theos"

          echo "THEOS=$THEOS"
          echo "THEOS_MAKE_PATH=$THEOS/makefiles"

          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/tweak.mk"
          test -f "$THEOS/makefiles/master/tweak.mk"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang++"

          echo "[FFNET] Theos installation OK"

      - name: Build dylib
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make clean || true

          make package \
            FINALPACKAGE=1 \
            TARGET=iphone:clang:16.5:14.0

      - name: Sign dylib with ldid
        run: |
          find . -name "*.dylib" -type f | while read -r f; do
            if [ -f "entitlements.plist" ]; then
              ldid -Sentitlements.plist "$f"
            else
              ldid -S "$f"
            fi

            echo "[FFNET] Signed: $f"
          done

      - name: Package artifacts
        run: |
          mkdir -p dist

          DEB="$(find . -path "*/packages/*.deb" -type f | head -1)"

          if [ -n "$DEB" ]; then
            cp "$DEB" dist/FFNET_IOS.deb
          fi

          DYLIB="$(find . -name "FFNET_IOS.dylib" -type f | head -1)"

          if [ -n "$DYLIB" ]; then
            cp "$DYLIB" dist/FFNET_IOS.dylib
          fi

          if [ -f "dist/FFNET_IOS.dylib" ]; then
            mkdir -p inject_pkg/Frameworks

            cp \
              dist/FFNET_IOS.dylib \
              inject_pkg/Frameworks/FFNET_IOS.dylib

            cat > inject_pkg/inject.sh << 'EOF'
          #!/bin/sh

          TARGET_IPA="FreeFire.ipa"
          DYLIB="FFNET_IOS.dylib"

          echo "[FFNET] Injecting $DYLIB into $TARGET_IPA"

          unzip -q "$TARGET_IPA" -d extracted

          cp \
            "$DYLIB" \
            extracted/Payload/FreeFire.app/Frameworks/

          optool install -c load \
            -p "@executable_path/Frameworks/FFNET_IOS.dylib" \
            -t extracted/Payload/FreeFire.app/FreeFire

          cd extracted

          zip -qr "../FFNET_patched.ipa" .

          cd ..

          rm -rf extracted

          echo "[FFNET] Done -> FFNET_patched.ipa"
          EOF

            chmod +x inject_pkg/inject.sh

            zip -r \
              dist/FFNET_inject_pkg.zip \
              inject_pkg/
          fi

          echo "[FFNET] Artifacts:"
          ls -lah dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FFNET_IOS_OB54
          path: dist/
          retention-days: 30
