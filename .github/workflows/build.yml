name: FFNET IOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update -y

          sudo apt-get install -y \
            git curl make perl zip unzip \
            clang llvm lld \
            cmake libplist-dev libssl-dev \
            pkg-config libxml2-dev \
            fakeroot xz-utils \
            libio-compress-lzma-perl \
            wget

          echo "[FFNET] Base dependencies installed"

      - name: Install legacy libtinfo.so.5
        run: |
          set -e

          echo "[FFNET] Installing legacy ncurses library..."

          cd /tmp

          rm -f libtinfo5.deb

          wget -O libtinfo5.deb \
            "http://archive.ubuntu.com/ubuntu/pool/main/n/ncurses/libtinfo5_6.2-0ubuntu2_amd64.deb"

          echo "[FFNET] Checking package..."

          dpkg-deb --info libtinfo5.deb

          echo "[FFNET] Installing libtinfo5..."

          sudo dpkg -i libtinfo5.deb

          echo "[FFNET] Checking installed library..."

          ldconfig -p | grep libtinfo

          ls -lah /lib/x86_64-linux-gnu/libtinfo.so.5*

          echo "[FFNET] libtinfo.so.5 installed successfully"

      - name: Build & install ldid from source
        run: |
          set -e

          echo "[FFNET] Cloning ldid..."

          rm -rf /tmp/ldid

          git clone \
            https://github.com/ProcursusTeam/ldid.git \
            /tmp/ldid

          cd /tmp/ldid

          echo "[FFNET] Building ldid..."

          make -j"$(nproc)"

          echo "[FFNET] Installing ldid..."

          sudo make install

          echo "[FFNET] Checking ldid..."

          command -v ldid

          ldid -h || true

          echo "[FFNET] ldid installed successfully"

      - name: Install Theos
        run: |
          set -e

          export THEOS="${{ github.workspace }}/theos"

          echo "[FFNET] Installing Theos..."

          rm -rf "$THEOS"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo "[FFNET] Installing Linux iOS toolchain..."

          rm -f /tmp/linux-ios-toolchain.tar.lzma

          curl -fL \
            "https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma" \
            -o /tmp/linux-ios-toolchain.tar.lzma

          TMP="$(mktemp -d)"

          echo "[FFNET] Extracting toolchain..."

          tar --lzma \
            -xf /tmp/linux-ios-toolchain.tar.lzma \
            -C "$TMP"

          mkdir -p \
            "$THEOS/toolchain/linux/iphone"

          if [ -d "$TMP/ios-arm64e-clang-toolchain" ]; then

            cp -a \
              "$TMP/ios-arm64e-clang-toolchain/." \
              "$THEOS/toolchain/linux/iphone/"

          else

            echo "[FFNET] ERROR: Toolchain archive has unexpected structure"

            find "$TMP" \
              -maxdepth 3 \
              -type f \
              | head -100

            exit 1

          fi

          rm -rf "$TMP"
          rm -f /tmp/linux-ios-toolchain.tar.lzma

          echo "[FFNET] Checking toolchain..."

          test -x \
            "$THEOS/toolchain/linux/iphone/bin/clang"

          test -x \
            "$THEOS/toolchain/linux/iphone/bin/clang++"

          echo "[FFNET] clang:"

          "$THEOS/toolchain/linux/iphone/bin/clang" \
            --version

          echo "[FFNET] clang++:"

          "$THEOS/toolchain/linux/iphone/bin/clang++" \
            --version

          echo "[FFNET] Toolchain OK"

      - name: Download iOS SDK
        run: |
          set -e

          export THEOS="${{ github.workspace }}/theos"

          mkdir -p \
            "$THEOS/sdks"

          echo "[FFNET] Downloading iPhoneOS16.5 SDK..."

          rm -f /tmp/sdk.tar.xz

          curl -fL \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" \
            -o /tmp/sdk.tar.xz

          echo "[FFNET] SDK archive:"

          file /tmp/sdk.tar.xz

          echo "[FFNET] Extracting SDK..."

          tar -xf \
            /tmp/sdk.tar.xz \
            -C "$THEOS/sdks"

          rm -f /tmp/sdk.tar.xz

          echo "[FFNET] SDKs:"

          ls -lah \
            "$THEOS/sdks"

          test -d \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "[FFNET] SDK OK"

      - name: Download Substrate headers
        run: |
          set -e

          export THEOS="${{ github.workspace }}/theos"

          mkdir -p \
            "$THEOS/include"

          echo "[FFNET] Downloading headers..."

          rm -f /tmp/headers.tar.gz

          curl -fL \
            "https://github.com/theos/headers/archive/refs/heads/master.tar.gz" \
            -o /tmp/headers.tar.gz

          tar -xf \
            /tmp/headers.tar.gz \
            -C "$THEOS/include" \
            --strip-components=1

          rm -f /tmp/headers.tar.gz

          echo "[FFNET] Headers installed"

      - name: Verify Theos
        run: |
          set -e

          export THEOS="${{ github.workspace }}/theos"

          echo "THEOS=$THEOS"
          echo "THEOS_MAKE_PATH=$THEOS/makefiles"

          echo "[FFNET] Checking Theos..."

          test -f \
            "$THEOS/makefiles/common.mk"

          test -f \
            "$THEOS/makefiles/tweak.mk"

          test -f \
            "$THEOS/makefiles/master/tweak.mk"

          echo "[FFNET] Checking compiler..."

          test -x \
            "$THEOS/toolchain/linux/iphone/bin/clang"

          test -x \
            "$THEOS/toolchain/linux/iphone/bin/clang++"

          echo "[FFNET] Checking SDK..."

          test -d \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "[FFNET] Checking ldid..."

          command -v ldid

          echo "[FFNET] Theos installation OK"

      - name: Build dylib
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -e

          echo "[FFNET] Cleaning previous build..."

          make clean || true

          echo "[FFNET] Building FFNET_IOS..."

          make package \
            FINALPACKAGE=1 \
            TARGET=iphone:clang:16.5:14.0

          echo "[FFNET] Build completed"

      - name: Sign dylib with ldid
        run: |
          set -e

          echo "[FFNET] Searching for dylibs..."

          FOUND=0

          while IFS= read -r -d '' f; do

            FOUND=1

            echo "[FFNET] Signing: $f"

            if [ -f "entitlements.plist" ]; then

              ldid \
                -Sentitlements.plist \
                "$f"

            else

              ldid \
                -S \
                "$f"

            fi

            echo "[FFNET] Signed: $f"

          done < <(
            find . \
              -name "*.dylib" \
              -type f \
              -print0
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "[FFNET] WARNING: No dylib found to sign"
          fi

          echo "[FFNET] Signing step completed"

      - name: Package artifacts
        run: |
          set -e

          mkdir -p dist

          echo "[FFNET] Searching for DEB..."

          DEB="$(
            find . \
              -path "*/packages/*.deb" \
              -type f \
              | head -1
          )"

          if [ -n "$DEB" ]; then

            cp \
              "$DEB" \
              dist/FFNET_IOS.deb

            echo "[FFNET] DEB copied: $DEB"

          else

            echo "[FFNET] No DEB found"

          fi

          echo "[FFNET] Searching for dylib..."

          DYLIB="$(
            find . \
              -name "FFNET_IOS.dylib" \
              -type f \
              | head -1
          )"

          if [ -n "$DYLIB" ]; then

            cp \
              "$DYLIB" \
              dist/FFNET_IOS.dylib

            echo "[FFNET] Dylib copied: $DYLIB"

          else

            echo "[FFNET] No FFNET_IOS.dylib found"

          fi

          if [ -f "dist/FFNET_IOS.dylib" ]; then

            echo "[FFNET] Creating injection package..."

            rm -rf inject_pkg

            mkdir -p \
              inject_pkg/Frameworks

            cp \
              dist/FFNET_IOS.dylib \
              inject_pkg/Frameworks/FFNET_IOS.dylib

            cat > inject_pkg/inject.sh << 'EOF'
          #!/bin/sh

          set -e

          TARGET_IPA="FreeFire.ipa"
          DYLIB="FFNET_IOS.dylib"

          echo "[FFNET] Injecting $DYLIB into $TARGET_IPA"

          if [ ! -f "$TARGET_IPA" ]; then
            echo "[FFNET] ERROR: $TARGET_IPA not found"
            exit 1
          fi

          if [ ! -f "$DYLIB" ]; then
            echo "[FFNET] ERROR: $DYLIB not found"
            exit 1
          fi

          rm -rf extracted

          unzip -q \
            "$TARGET_IPA" \
            -d extracted

          APP="extracted/Payload/FreeFire.app"

          if [ ! -d "$APP" ]; then
            echo "[FFNET] ERROR: FreeFire.app not found"
            exit 1
          fi

          mkdir -p \
            "$APP/Frameworks"

          cp \
            "$DYLIB" \
            "$APP/Frameworks/FFNET_IOS.dylib"

          if command -v optool >/dev/null 2>&1; then

            optool install -c load \
              -p "@executable_path/Frameworks/FFNET_IOS.dylib" \
              -t "$APP/FreeFire"

          else

            echo "[FFNET] WARNING: optool is not installed."
            echo "[FFNET] DYLIB copied but load command was not added."

          fi

          cd extracted

          zip -qr \
            "../FFNET_patched.ipa" \
            .

          cd ..

          rm -rf extracted

          echo "[FFNET] Done -> FFNET_patched.ipa"
          EOF

            chmod +x \
              inject_pkg/inject.sh

            zip -r \
              dist/FFNET_inject_pkg.zip \
              inject_pkg/

            echo "[FFNET] Injection package created"

          fi

          echo ""
          echo "======================================"
          echo "[FFNET] FINAL ARTIFACTS"
          echo "======================================"

          ls -lah dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FFNET_IOS_OB54
          path: dist/
          retention-days: 30
